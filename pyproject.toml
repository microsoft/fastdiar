[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fastdiar"
version = "0.1.0"
description = "Frame-level speaker encoder and online clustering for streaming speaker diarization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
fastdiar-diarize = "fastdiar.run_diarizer:main"
fastdiar-embed = "fastdiar.run_encoder:main"
fastdiar-demo = "fastdiar.app:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["fastdiar*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # function calls in argument defaults (common for argparse/torch)
]

[tool.ruff.lint.isort]
known-first-party = ["fastdiar"]
