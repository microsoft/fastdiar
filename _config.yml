title: FASTDIAR
description: Frame-Level Speaker Encoder for Streaming Diarization
theme: jekyll-theme-minimal
show_downloads: false

# Repository docs are not part of the demo page. Jekyll 3 replaces its default
# exclude list with this one, so the local-preview files are listed too.
exclude:
  - README.md
  - CODE_OF_CONDUCT.md
  - SECURITY.md
  - SUPPORT.md
  - Gemfile
  - Gemfile.lock
  - serve.sh
  - vendor/
